name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Require GitHub Actions secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Add repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID under GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Account access tokens are sbp_... Project keys are eyJ... (legacy JWT),
          # sb_publishable_..., or sb_secret_...
          if echo "$SUPABASE_ACCESS_TOKEN" | grep -Eq '^(eyJ|sb_publishable_|sb_secret_)'; then
            echo "::error::SUPABASE_ACCESS_TOKEN looks like a project API key or JWT. Use an Account Access Token from https://supabase.com/dashboard/account/tokens (they start with sbp_). Do not use Project Settings → API keys."
            exit 1
          fi
          if echo "$SUPABASE_PROJECT_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
            echo "::error::SUPABASE_PROJECT_ID looks like a UUID. Use Project Settings → General → Reference ID (the subdomain of https://xxxx.supabase.co), not the organization UUID."
            exit 1
          fi

      - name: List project refs this token can see
        continue-on-error: true
        run: |
          HTTP=$(curl -sS -o /tmp/supabase-projects.json -w "%{http_code}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects")
          echo "GET /v1/projects -> HTTP ${HTTP}"
          if [ "$HTTP" = "200" ]; then
            python3 - <<'PY'
          import json, os
          data = json.load(open("/tmp/supabase-projects.json"))
          wanted = os.environ["SUPABASE_PROJECT_ID"]
          refs = []
          for project in data if isinstance(data, list) else []:
              refs.append(str(project.get("ref") or project.get("id") or ""))
          print("Token can see refs:", ", ".join(refs) or "(none)")
          print("Configured SUPABASE_PROJECT_ID is in that list:", wanted in refs)
          PY
          else
            echo "Could not list projects (fine-grained tokens often lack projects_read). Continuing to deploy."
          fi

      - name: Deploy geocode-venue
        run: supabase functions deploy geocode-venue --use-api --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy send-email
        run: supabase functions deploy send-email --use-api --project-ref "$SUPABASE_PROJECT_ID"
