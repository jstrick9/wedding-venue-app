name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Require GitHub Actions secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Add repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID under GitHub → Settings → Secrets and variables → Actions. Create the access token at https://supabase.com/dashboard/account/tokens (browser). Project ID is the subdomain of your Supabase URL (https://abcdefghij.supabase.co → abcdefghij)."
            exit 1
          fi

      - name: Verify token can administer the project
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o /tmp/supabase-project.json -w "%{http_code}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Supabase Management API returned HTTP ${HTTP} for project ${SUPABASE_PROJECT_ID}. SUPABASE_ACCESS_TOKEN must be an Account Access Token from https://supabase.com/dashboard/account/tokens, created while signed in as an Owner or Administrator of that project. Do not use the project's anon, publishable, or service_role API keys. SUPABASE_PROJECT_ID must be Project Settings → General → Reference ID."
            python3 -c 'import json; print(json.load(open("/tmp/supabase-project.json")).get("message","(no message)"))' || true
            exit 1
          fi

      - name: Deploy all Edge Functions
        run: supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_ID"
