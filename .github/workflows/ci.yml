name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint event bus
        run: npm run lint:events
      - name: Lint (ESLint)
        run: npm run lint
      - name: Strict unused-locals scan (non-test)
        run: |
          # Fail only when the scan prints real violations. A plain
          # `tsc ... | grep -v ...` pipeline exits 1 when tsc is CLEAN (grep
          # matched nothing), which inverted this gate: CI failed on every
          # clean commit and passed only when violations existed (Review #245).
          output=$(npx tsc --noEmit --noUnusedLocals 2>&1 | grep -v "\.test\." | grep -v "node_modules" || true)
          if [ -n "$output" ]; then
            echo "$output"
            echo "::error::Strict unused-locals scan found violations above."
            exit 1
          fi
          echo "Strict unused-locals scan clean."
      - name: Run tests
        run: npm run test
      - name: Build (single-file)
        run: npm run build
      - name: Bundle budget (single-file gzip)
        run: node scripts/check-bundle-budget.mjs single
      - name: Build (split / code-split)
        run: npm run build:split
      - name: Bundle budget (split chunks)
        run: node scripts/check-bundle-budget.mjs split
      - name: '@ts-nocheck ratchet'
        run: node scripts/check-ts-nocheck-ratchet.mjs
      - name: Production dependency audit (no dev tooling)
        run: npm audit --omit=dev
