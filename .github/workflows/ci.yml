name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint event bus
        run: npm run lint:events
      - name: Lint (ESLint)
        run: npm run lint
      - name: Strict unused-locals scan (non-test)
        run: npx tsc --noEmit --noUnusedLocals 2>&1 | grep -v "\.test\." | grep -v "node_modules"
      - name: Run tests
        run: npm run test
      - name: Build (single-file)
        run: npm run build
      - name: Build (split / code-split)
        run: npm run build:split
      - name: Production dependency audit (no dev tooling)
        run: npm audit --omit=dev
