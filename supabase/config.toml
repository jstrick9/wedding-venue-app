# Used by `supabase functions deploy`. Project ref is still passed with --project-ref.
# Invite claim endpoints run before the invitee has a signed-in JWT.

[functions.claim-venue-admin]
verify_jwt = false

# Couple/collaborator/guest invitees are not authenticated until this function
# creates their account. The high-entropy invite token is validated by RPC 0021.
[functions.claim-portal-invite]
verify_jwt = false

# Password recovery begins before the account owner has a session. Migration
# 0022 supplies service-only membership checks and abuse throttling.
[functions.request-password-reset]
verify_jwt = false
